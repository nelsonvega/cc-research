[project]
name = "cc-research"
version = "0.1.0"
description = "Multi-provider parallel news research with markdown output"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
cc-research = "server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
